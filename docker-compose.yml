services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diamond_black_dev
      POSTGRES_USER: diamondblack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-internal]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U diamondblack -d diamond_black_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  uploads-init:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1001:65533 /uploads && chmod 755 /uploads && find /uploads -type f -exec chmod 644 {} \\;"]
    volumes:
      - uploads_data:/uploads
    networks: [app-internal]
    restart: "no"
  app:
    image: ${APP_IMAGE:-fomawill/diamond-black-app:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Diamond Black Administrator}
      NEWSLETTER_PROVIDER: ${NEWSLETTER_PROVIDER:-disabled}
      NEWSLETTER_API_KEY: ${NEWSLETTER_API_KEY:-}
      NEWSLETTER_AUDIENCE_ID: ${NEWSLETTER_AUDIENCE_ID:-}
      NEWSLETTER_DATA_CENTER: ${NEWSLETTER_DATA_CENTER:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.titan.email}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Diamond Black Corporation}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-}
      EVENT_NOTIFICATION_EMAIL: ${EVENT_NOTIFICATION_EMAIL:-}
    volumes:
      - uploads_data:/app/public/uploads
    expose: ["3000"]
    networks: [app-internal]
    depends_on:
      db:
        condition: service_healthy
      uploads-init:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp,/app/.next/cache]
    init: true
  caddy:
    image: caddy:2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      SITE_ADDRESS: ${SITE_ADDRESS}
    restart: unless-stopped
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [app-internal]
    depends_on: [app]
networks:
  app-internal:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
