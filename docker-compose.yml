services:
  app:
    image: fomawill/diamond-black-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEWSLETTER_PROVIDER: ${NEWSLETTER_PROVIDER:-disabled}
      NEWSLETTER_API_KEY: ${NEWSLETTER_API_KEY:-}
      NEWSLETTER_AUDIENCE_ID: ${NEWSLETTER_AUDIENCE_ID:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.titan.email}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Diamond Black Corporation}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      EVENT_NOTIFICATION_EMAIL: ${EVENT_NOTIFICATION_EMAIL:-}
    expose:
      - "3000"
    networks:
      - app-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    init: true

  caddy:
    image: caddy:2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      SITE_ADDRESS: ${SITE_ADDRESS}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-internal
    depends_on:
      - app

networks:
  app-internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: